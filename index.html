<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="A camera-based value finder for artists.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Value Scope</title>
</head>
<body>
  <main class="app-shell">
    <section class="camera-stage" aria-label="Camera value finder">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="freezeCanvas" class="freeze-frame" aria-hidden="true"></canvas>
      <div class="camera-vignette" aria-hidden="true"></div>

      <header class="topbar">
        <div>
          <p class="eyebrow">Artist’s value finder</p>
          <h1>Value Scope</h1>
        </div>
        <span id="cameraStatus" class="status-pill">Starting camera</span>
      </header>

      <aside id="valueScale" class="value-scale" aria-label="Greyscale values, one lightest to ten darkest"></aside>

      <div class="aperture-wrap" aria-hidden="true">
        <div id="aperture" class="aperture">
          <span class="crosshair crosshair-x"></span>
          <span class="crosshair crosshair-y"></span>
        </div>
      </div>

      <section class="reading-card" aria-live="polite">
        <div class="reading-main">
          <span class="reading-label">Value</span>
          <strong id="valueNumber">—</strong>
        </div>
        <div class="reading-details">
          <div id="currentSwatch" class="current-swatch" aria-label="Nearest value swatch"></div>
          <div>
            <span id="luminancePercent">—%</span>
            <small>Luminance</small>
          </div>
        </div>
        <div id="matchStatus" class="match-status idle">Set a target to compare</div>
      </section>

      <div class="controls">
        <button id="freezeButton" class="control-button" type="button">
          <span class="control-icon" aria-hidden="true">◉</span>
          <span>Freeze</span>
        </button>
        <button id="targetButton" class="control-button primary" type="button">
          <span class="control-icon" aria-hidden="true">⌖</span>
          <span>Set target</span>
        </button>
      </div>
    </section>

    <section class="calibration-panel">
      <div>
        <p class="eyebrow">Calibration</p>
        <p id="calibrationStatus">Defaults active</p>
      </div>
      <div class="calibration-actions">
        <button id="whiteButton" type="button"><span class="cal-dot white"></span>Set white</button>
        <button id="blackButton" type="button"><span class="cal-dot black"></span>Set black</button>
      </div>
    </section>

    <footer>
      <span>Point the aperture at a flat area</span>
      <span class="build-label">Build VS-001</span>
    </footer>
  </main>

  <canvas id="sampleCanvas" width="64" height="64" hidden></canvas>
  <script src="./app.js" defer></script>
</body>
</html>
