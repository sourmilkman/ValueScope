<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#10100f">
  <meta name="description" content="A camera-based value comparison tool for artists.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Value Scope</title>
</head>
<body>
  <main class="app-shell">
    <section id="valueField" class="value-field" aria-label="Selectable value scale" tabindex="0"></section>
    <div id="comparisonField" class="comparison-field" aria-hidden="true">
      <strong id="comparisonLabel">5</strong>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Value Scope</h1>
          <span id="cameraStatus">Starting camera</span>
        </div>
      </div>

      <div class="scale-switch" role="group" aria-label="Value scale">
        <button id="standardMode" class="active" type="button">Standard</button>
        <button id="munsellMode" type="button">Munsell N</button>
      </div>
    </header>

    <section class="aperture-stage" aria-label="Camera comparison aperture">
      <div id="aperture" class="aperture">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="freezeCanvas" aria-hidden="true"></canvas>
        <span class="aperture-centre" aria-hidden="true"></span>
      </div>
    </section>

    <div id="selectedBadge" class="selected-badge" aria-live="polite">
      <small>Selected</small>
      <strong>5</strong>
    </div>

    <section class="control-dock" aria-label="Camera controls">
      <button id="cameraModeButton" class="dock-button" type="button">
        <span class="button-icon half-tone" aria-hidden="true"></span>
        <span id="cameraModeLabel">Colour</span>
      </button>

      <label class="size-control">
        <span>Opening</span>
        <input id="apertureSize" type="range" min="96" max="240" value="152" aria-label="Aperture size">
      </label>

      <button id="freezeButton" class="dock-button" type="button">
        <span class="button-icon freeze-icon" aria-hidden="true"></span>
        <span id="freezeLabel">Freeze</span>
      </button>
    </section>

    <footer>
      <span id="scaleNote">Even digital steps</span>
      <span>Tap or slide a value</span>
      <span class="build-label">VS-003</span>
    </footer>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
